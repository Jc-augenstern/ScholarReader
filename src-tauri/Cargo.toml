[package]
name = "scholar-reader"
version = "0.1.3"
description = "A local-first PDF study reader with optional AI enhancements"
authors = ["ScholarReader contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scholar_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
dunce = "1"
thiserror = "2"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
fs2 = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1", default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[dev-dependencies]
tempfile = "3"
